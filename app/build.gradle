plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

def slackWebhookUrl = project.rootProject.file("local.properties").withInputStream {
    def props = new Properties()
    props.load(it)
    return props.getProperty("slackWebhookUrl", "")
}

android {
    namespace = "com.feveral.seniorhigh"
    compileSdk = 36
    defaultConfig {
        applicationId = "com.feveral.seniorhigh"
        minSdk = 23
        targetSdk = 36
        versionCode = 24
        versionName = "1.18.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true
        buildConfigField "String", "SLACK_WEBHOOK_URL", "\"${slackWebhookUrl}\""
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        resources {
            excludes += 'commonMain/default/manifest'
            pickFirsts += ['commonMain/default/linkdata/root_package/*',
                           'commonMain/default/linkdata/module',
                           'META-INF/kotlin-project-structure-metadata.json']
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    testImplementation 'junit:junit:4.13.2'
}
