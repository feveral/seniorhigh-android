apply plugin: 'com.android.application'

def slackWebhookUrl = project.rootProject.file("local.properties").withInputStream {
    def props = new Properties()
    props.load(it)
    return props.getProperty("slackWebhookUrl", "")
}

android {
    compileSdkVersion 33
    buildToolsVersion "30.0.1"
    defaultConfig {
        applicationId "com.feveral.seniorhigh"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 23
        versionName "1.17.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "String", "SLACK_WEBHOOK_URL", "\"${slackWebhookUrl}\""
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    packagingOptions {
        exclude 'commonMain/default/manifest'
        pickFirst 'commonMain/default/linkdata/root_package/*'
        pickFirst 'commonMain/default/linkdata/module'
        pickFirst 'META-INF/kotlin-project-structure-metadata.json'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation('androidx.test.espresso:espresso-core:3.1.0-alpha4', {
        exclude group: 'com.android.support', module: 'support-annotations'
    })
    implementation 'com.google.android.material:material:1.0.0-beta01'
    implementation 'androidx.appcompat:appcompat:1.0.0-beta01'
    implementation 'androidx.cardview:cardview:1.0.0-beta01'
    implementation 'androidx.recyclerview:recyclerview:1.0.0-beta01'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation 'com.google.android.gms:play-services-ads:25.0.0'
    testImplementation 'junit:junit:4.12'
}


apply plugin: 'com.google.gms.google-services'
